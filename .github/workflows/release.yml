name: Release

# Push a tag like v0.3.0 (matching the version in package.json) to publish a release
# with the built extension as a zip.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: The tag must match the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build and zip the extension
        run: |
          npm run build
          cd dist && zip -r "../project-workspaces-${GITHUB_REF_NAME#v}.zip" .

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Install:** unzip, open brave://extensions (or chrome://extensions), turn on Developer mode, click Load unpacked and choose the unzipped folder.\n' >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "project-workspaces-${GITHUB_REF_NAME#v}.zip" \
            --title "Project workspaces ${GITHUB_REF_NAME}" \
            --notes-file notes.md
