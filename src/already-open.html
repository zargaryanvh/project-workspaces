<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Already open</title>
    <link rel="stylesheet" href="already-open.css" />
    <script type="module" src="already-open.js"></script>
  </head>
  <body>
    <main class="sheet" aria-labelledby="title">
      <h1 id="title">This site is already open</h1>
      <p id="address" class="address"></p>
      <div class="actions">
        <button id="close" type="button" class="primary big">Close this tab</button>
        <button id="anyway" type="button" class="link">Open anyway</button>
      </div>
      <p id="where" class="where"></p>
      <h2 id="list-title">Go to a tab you have</h2>
      <ul id="tabs" class="tabs"></ul>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
  </body>
</html>
