<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects</title>
    <link rel="stylesheet" href="panel.css" />
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1>Projects</h1>
        <button id="open-options" class="icon-button" type="button" title="Settings and addresses" aria-label="Settings and addresses">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"
            />
          </svg>
        </button>
      </header>
      <p id="error" class="error" role="alert" hidden></p>
      <div id="scroll" class="scroll">
        <ul id="list" class="list" aria-label="Projects in this window"></ul>
        <p id="empty" class="empty" hidden>
          No projects in this window yet. Select one or more tabs in the tab bar, then make a project below.
        </p>
      </div>
      <footer class="foot">
        <section id="create" class="create" aria-label="New project"></section>
        <button id="open-shortcuts" class="link shortcuts" type="button">Keyboard shortcuts</button>
      </footer>
    </div>
  </body>
</html>
